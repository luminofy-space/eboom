# Base stack: PostgreSQL + backend + frontend + docs.
# Configuration comes from a single .env file — `cp .env.example .env` first.
# For production, add the overlay: -f docker-compose.yml -f docker-compose.prod.yml
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eboom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eboom}
      POSTGRES_DB: ${POSTGRES_DB:-eboom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eboom} -d ${POSTGRES_DB:-eboom}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./eboom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # All backend settings come straight from .env (see .env.example).
    env_file:
      - .env
    environment:
      # Derived/fixed values only — everything else lives in .env.
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-eboom}:${POSTGRES_PASSWORD:-eboom}@postgres:5432/${POSTGRES_DB:-eboom}}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build:
      context: ./eboom-frontend
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:4000}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  docs:
    build:
      context: ./docs
      args:
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com}
        VITEPRESS_BASE: /
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-4173}:80"

volumes:
  postgres_data:
